   </g>
   <g id="text_5">
    <text style="fill: #e4eee5; font: 14px 'Noto Sans CJK JP'" transform="translate(68.4 351.703125)">DermFM-Zero 皮肤图像表征</text>
    <text style="fill: #e4eee5; font: 14px 'Noto Sans CJK JP'" transform="translate(68.4 373.853312)">医学文本编码与临床信息融合</text>
